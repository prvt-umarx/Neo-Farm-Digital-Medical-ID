<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neo Farm - Digital Medical ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
      
      :root {
        --neo-primary: #10b981;
        --neo-secondary: #6366f1;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f8fafc;
        background-image: 
          radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.05) 0px, transparent 50%);
        min-height: 100vh;
        color: #1e293b;
      }

      .glass {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .scanner-laser {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, #10b981, transparent);
        box-shadow: 0 0 20px 2px rgba(16, 185, 129, 0.8);
        animation: laser-scan 2.5s ease-in-out infinite;
      }

      @keyframes laser-scan {
        0%, 100% { top: 5%; opacity: 0.5; }
        50% { top: 95%; opacity: 1; }
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      .btn-hover-effect {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .btn-hover-effect:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }
      .btn-hover-effect:active {
        transform: translateY(0);
      }

      .card-gradient-blue { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
      .card-gradient-emerald { background: linear-gradient(135deg, #059669 0%, #047857 100%); }
      .card-gradient-amber { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); }
      .card-gradient-indigo { background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); }

      /* Smooth Tab Transitions */
      .tab-content-enter {
        opacity: 0;
        transform: translateY(10px);
      }
      .tab-content-enter-active {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 300ms, transform 300ms;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "jsqr": "https://esm.sh/jsqr@1.4.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
